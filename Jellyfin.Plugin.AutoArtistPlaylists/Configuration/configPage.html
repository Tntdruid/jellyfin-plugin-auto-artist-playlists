<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Auto Artist Playlists</title>
</head>
<body>
    <div id="AutoArtistPlaylistsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="AutoArtistPlaylistsConfigForm">
                    <h2>Auto Artist Playlists</h2>
                    <p data-i18n="intro"></p>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="ThresholdPercent" data-i18n="threshold"></label>
                        <input id="ThresholdPercent" name="ThresholdPercent" type="number" is="emby-input" min="1" max="100" />
                        <div class="fieldDescription" data-i18n="thresholdHelp"></div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="MarkAsFavorite" name="MarkAsFavorite" type="checkbox" is="emby-checkbox" />
                            <span data-i18n="markSong"></span>
                        </label>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="MarkPlaylistAsFavorite" name="MarkPlaylistAsFavorite" type="checkbox" is="emby-checkbox" />
                            <span data-i18n="markPlaylist"></span>
                        </label>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="RemoveWhenUnfavorited" name="RemoveWhenUnfavorited" type="checkbox" is="emby-checkbox" />
                            <span data-i18n="removeUnfavorited"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-i18n="removeUnfavoritedHelp"></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="PlaylistPrefix" data-i18n="prefix"></label>
                        <input id="PlaylistPrefix" name="PlaylistPrefix" type="text" is="emby-input" />
                        <div class="fieldDescription" data-i18n="prefixHelp"></div>
                    </div>

                    <h3 data-i18n="import"></h3>
                    <div class="fieldDescription" data-i18n="importHelp"></div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="ImportPlayedSongs" name="ImportPlayedSongs" type="checkbox" is="emby-checkbox" />
                            <span data-i18n="importPlayed"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-i18n="importPlayedHelp"></div>
                    </div>

                    <h3 data-i18n="users"></h3>
                    <div class="fieldDescription" data-i18n="usersHelp"></div>
                    <div id="UserList"></div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span data-i18n="save"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">

                pluginUniqueId: '4ada4936-7154-478d-80f8-99d18faaebc2'

                    markSong: 'Mark the song with a heart (favorite)',

                    import: 'Import existing songs',

                    importPlayed: 'Also import songs I have played',
                    importPlayedHelp: 'Off: only songs you have hearted are imported. On: every song Jellyfin has marked as played (your whole history) is imported too and gets a heart.',

                },
                da: {

                    removeUnfavoritedHelp: 'En sang, du fjerner hjertet fra, bliver ikke tilføjet igen de næste 24 timer, selvom du bliver ved med at høre den.',
                    import: 'Importér eksisterende sange',

                    importPlayed: 'Importér også sange, jeg har hørt',

                    removeUnfavorited: 'Ta bort låten från spellistan när hjärtat tas bort',
                    removeUnfavoritedHelp: 'En låt som du tar bort hjärtat från läggs inte till igen under 24 timmar, även om du fortsätter att lyssna på den.',
                    import: 'Importera befintliga låtar',
                    importHelp: 'Gå till Kontrollpanel → Schemalagda aktiviteter → Auto Artist Playlists → "Import existing songs" och kör den en gång för att lägga till låtar som du redan har hjärtmarkerat i artistspellistorna.',
                    importPlayed: 'Importera även låtar jag har spelat',
                    importPlayedHelp: 'Av: endast hjärtmarkerade låtar importeras. På: alla låtar som Jellyfin har markerat som spelade (hela din historik) importeras också och får ett hjärta.',
                    prefix: 'Prefix för spellistans namn',

                nb: {

                    importPlayedHelp: 'Av: bare sanger med hjerte importeres. På: alle sanger Jellyfin har merket som avspilt (hele historikken din), importeres også og får et hjerte.',
                    prefix: 'Prefiks for spillelistenavn',
                    prefixHelp: 'Valgfritt, f.eks. gir "❤️ " navnet "❤️ Katy Perry". Tomt gir bare "Katy Perry".',
                    users: 'Brukere',
                    usersHelp: 'Hvis ingen er valgt, gjelder utvidelsen for alle brukere.',
                    save: 'Lagre'
                },
                fi: {
                    intro: 'Kun kappaletta on kuunneltu vähintään valittu prosenttiosuus, se lisätään esittäjän mukaan nimettyyn yksityiseen soittolistaan ja merkitään sydämellä.',
                    threshold: 'Raja (%)',
                    thresholdHelp: 'Kuinka suuri osa kappaleesta on kuunneltava, ennen kuin se lasketaan. Oletus on 70.',
                    markSong: 'Merkitse kappale sydämellä (suosikki)',
                    markPlaylist: 'Merkitse esittäjän soittolista sydämellä (suosikki)',
                    removeUnfavorited: 'Poista kappale soittolistalta, kun sydän poistetaan',
                    removeUnfavoritedHelp: 'Kappaletta, jolta poistat sydämen, ei lisätä uudelleen 24 tuntiin, vaikka jatkaisit sen kuuntelemista.',
                    import: 'Tuo olemassa olevat kappaleet',
                    importHelp: 'Siirry kohtaan Hallintapaneeli → Ajastetut tehtävät → Auto Artist Playlists → "Import existing songs" ja suorita se kerran, niin jo sydämellä merkitsemäsi kappaleet lisätään esittäjien soittolistoihin.',
                    importPlayed: 'Tuo myös kuuntelemani kappaleet',
                    importPlayedHelp: 'Pois: vain sydämellä merkityt kappaleet tuodaan. Päällä: myös kaikki kappaleet, jotka Jellyfin on merkinnyt toistetuiksi (koko historiasi), tuodaan ja merkitään sydämellä.',
                    prefix: 'Soittolistan nimen etuliite',
                    prefixHelp: 'Valinnainen, esim. "❤️ " antaa nimen "❤️ Katy Perry". Tyhjä antaa pelkän "Katy Perry".',
                    users: 'Käyttäjät',
                    usersHelp: 'Jos yhtään käyttäjää ei ole valittu, lisäosa koskee kaikkia käyttäjiä.',
                    save: 'Tallenna'
                },
                is: {
                    intro: 'Þegar lag hefur verið spilað að minnsta kosti valið hlutfall er því bætt við einkalagalista sem ber nafn flytjandans og það merkt með hjarta.',
                    threshold: 'Mörk (%)',
                    thresholdHelp: 'Hversu mikið af laginu þarf að spila áður en það telst með. Sjálfgefið er 70.',
                    markSong: 'Merkja lagið með hjarta (eftirlæti)',
                    markPlaylist: 'Merkja lagalista flytjandans með hjarta (eftirlæti)',
                    removeUnfavorited: 'Fjarlægja lagið af lagalistanum þegar hjartað er fjarlægt',
                    removeUnfavoritedHelp: 'Lagi sem þú fjarlægir hjartað af er ekki bætt við aftur í 24 klukkustundir, jafnvel þótt þú haldir áfram að hlusta á það.',
                    import: 'Flytja inn núverandi lög',
                    importHelp: 'Farðu í Stjórnborð → Áætluð verkefni → Auto Artist Playlists → "Import existing songs" og keyrðu það einu sinni til að bæta lögum sem þú hefur þegar merkt með hjarta við lagalista flytjenda.',
                    importPlayed: 'Flytja einnig inn lög sem ég hef spilað',
                    importPlayedHelp: 'Slökkt: aðeins lög með hjarta eru flutt inn. Kveikt: öll lög sem Jellyfin hefur merkt sem spiluð (öll saga þín) eru einnig flutt inn og fá hjarta.',
                    prefix: 'Forskeyti á nafni lagalista',
                    prefixHelp: 'Valfrjálst, t.d. gefur "❤️ " nafnið "❤️ Katy Perry". Autt gefur bara "Katy Perry".',
                    users: 'Notendur',
                    usersHelp: 'Ef enginn notandi er valinn gildir viðbótin fyrir alla notendur.',
                    save: 'Vista'
                }
            };

            // Other codes that should use one of the languages above.
            var AutoArtistPlaylistsLanguageAliases = {
                no: 'nb',
                nn: 'nb'
            };

            function getStrings() {
                // Jellyfin sets the html lang attribute to the user's display language.
                var lang = (document.documentElement.getAttribute('lang') || navigator.language || 'en')
                    .toLowerCase().split('-')[0];
                lang = AutoArtistPlaylistsLanguageAliases[lang] || lang;
                return AutoArtistPlaylistsStrings[lang] || AutoArtistPlaylistsStrings.en;
            }

            function translatePage(page) {
                var strings = getStrings();
                page.querySelectorAll('[data-i18n]').forEach(function (el) {
                    el.textContent = strings[el.getAttribute('data-i18n')] || AutoArtistPlaylistsStrings.en[el.getAttribute('data-i18n')];
                });
            }

            function normalizeId(id) {
                return (id || '').replace(/-/g, '').toLowerCase();
            }

            document.querySelector('#AutoArtistPlaylistsConfigPage')
                .addEventListener('pageshow', function () {
                    var page = this;
                    translatePage(page);
                    Dashboard.showLoadingMsg();
                    Promise.all([
                        ApiClient.getPluginConfiguration(AutoArtistPlaylistsConfig.pluginUniqueId),
                        ApiClient.getUsers()
                    ]).then(function (results) {
                        var config = results[0];
                        var users = results[1];
                        var enabled = (config.EnabledUserIds || []).map(normalizeId);

                        page.querySelector('#ThresholdPercent').value = config.ThresholdPercent;
                        page.querySelector('#MarkAsFavorite').checked = config.MarkAsFavorite;
                        page.querySelector('#MarkPlaylistAsFavorite').checked = config.MarkPlaylistAsFavorite;
                        page.querySelector('#RemoveWhenUnfavorited').checked = config.RemoveWhenUnfavorited;
                        page.querySelector('#ImportPlayedSongs').checked = config.ImportPlayedSongs;
                        page.querySelector('#PlaylistPrefix').value = config.PlaylistPrefix || '';

                        var list = page.querySelector('#UserList');
                        list.innerHTML = '';
                        users.forEach(function (user) {
                            var label = document.createElement('label');
                            label.className = 'emby-checkbox-label';
                            var input = document.createElement('input');
                            input.type = 'checkbox';
                            input.setAttribute('is', 'emby-checkbox');
                            input.className = 'chkUser';
                            input.dataset.userId = user.Id;
                            input.checked = enabled.indexOf(normalizeId(user.Id)) !== -1;
                            var span = document.createElement('span');
                            span.textContent = user.Name;
                            label.appendChild(input);
                            label.appendChild(span);
                            var container = document.createElement('div');
                            container.className = 'checkboxContainer';
                            container.appendChild(label);
                            list.appendChild(container);
                        });

                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#AutoArtistPlaylistsConfigForm')
                .addEventListener('submit', function (e) {
                    var form = this;
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(AutoArtistPlaylistsConfig.pluginUniqueId).then(function (config) {
                        var threshold = parseInt(form.querySelector('#ThresholdPercent').value, 10);
                        config.ThresholdPercent = isNaN(threshold) ? 70 : Math.min(100, Math.max(1, threshold));
                        config.MarkAsFavorite = form.querySelector('#MarkAsFavorite').checked;
                        config.MarkPlaylistAsFavorite = form.querySelector('#MarkPlaylistAsFavorite').checked;
                        config.RemoveWhenUnfavorited = form.querySelector('#RemoveWhenUnfavorited').checked;
                        config.ImportPlayedSongs = form.querySelector('#ImportPlayedSongs').checked;
                        config.PlaylistPrefix = form.querySelector('#PlaylistPrefix').value;
                        config.EnabledUserIds = Array.prototype.map.call(
                            form.querySelectorAll('.chkUser:checked'),
                            function (el) { return el.dataset.userId; });

                        ApiClient.updatePluginConfiguration(AutoArtistPlaylistsConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
