# Push a tag like v1.0.0 to build the plugin, publish a GitHub release
# and add the new version to manifest.json (the Jellyfin plugin repository).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TARGET_ABI: '12.2.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION=${TAG}.0" >> "$GITHUB_ENV"

      - name: Changelog from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '$0 == "## " v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no '## $TAG' section"
            exit 1
          fi
          cat notes.md

      - name: Build
        run: |
          dotnet publish Jellyfin.Plugin.AutoArtistPlaylists -c Release -o out \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"

      - name: Package
        run: |
          ZIP="auto-artist-playlists_${VERSION}.zip"
          (cd out && zip "../$ZIP" Jellyfin.Plugin.AutoArtistPlaylists.dll)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "CHECKSUM=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Update manifest.json
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg v "$VERSION" --arg abi "$TARGET_ABI" --arg url "$URL" --arg sum "$CHECKSUM" --arg ts "$TIMESTAMP" --rawfile log notes.md \
            '.[0].versions = ([{version: $v, changelog: ($log | rtrimstr("\n")), targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}] + [.[0].versions[] | select(.version != $v)])' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add version $VERSION to manifest"
          git push
